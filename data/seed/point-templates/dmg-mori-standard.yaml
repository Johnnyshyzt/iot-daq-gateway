apiVersion: daq.gateway/v1
kind: PointTemplate
metadata:
  id: dmg-mori-standard
  displayName: 三菱森精机 标准目录
spec:
  adapter: dmg-mori
  points:
    - id: state
      address: catalog/state
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: workMode
      address: catalog/workMode
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: program
      address: catalog/program
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: programBlock
      address: catalog/programBlock
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: partCount
      address: catalog/partCount
      dataType: number
      unit: pcs
      scale: 1
      deadband: 0
      enabled: true
    - id: feedOverride
      address: catalog/feedOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: estop
      address: catalog/estop
      dataType: bool
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: isRunning
      address: catalog/isRunning
      dataType: bool
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: isReset
      address: catalog/isReset
      dataType: bool
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: isCutting
      address: catalog/isCutting
      dataType: bool
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: toolNumber
      address: catalog/toolNumber
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: alarm
      address: catalog/alarm
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: feedRate
      address: catalog/feedRate
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeed
      address: catalog/spindleSpeed
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleOverride
      address: catalog/spindleOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: machinePosition
      address: catalog/machinePosition
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: programLine
      address: catalog/programLine
      dataType: number
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: axisLoadX
      address: catalog/axisLoadX
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: axisLoadY
      address: catalog/axisLoadY
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: axisLoadZ
      address: catalog/axisLoadZ
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
