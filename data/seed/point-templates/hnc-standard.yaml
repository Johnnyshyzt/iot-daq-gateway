apiVersion: daq.gateway/v1
kind: PointTemplate
metadata:
  id: hnc-standard
  displayName: 华中数控 标准目录
spec:
  adapter: hnc
  points:
    - id: workMode
      address: catalog/workMode
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: state
      address: catalog/state
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: toolNumber
      address: catalog/toolNumber
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: toolNext
      address: catalog/toolNext
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeedCmd
      address: catalog/spindleSpeedCmd
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeed
      address: catalog/spindleSpeed
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: feedRateCmd
      address: catalog/feedRateCmd
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: feedRate
      address: catalog/feedRate
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: estop
      address: catalog/estop
      dataType: bool
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: programMain
      address: catalog/programMain
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: program
      address: catalog/program
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: partCount
      address: catalog/partCount
      dataType: number
      unit: pcs
      scale: 1
      deadband: 0
      enabled: true
    - id: partCountTotal
      address: catalog/partCountTotal
      dataType: number
      unit: pcs
      scale: 1
      deadband: 0
      enabled: true
    - id: hnc_driveCurrent
      address: catalog/hnc_driveCurrent
      dataType: number
      unit: A
      scale: 1
      deadband: 0
      enabled: true
    - id: hnc_loadCurrent
      address: catalog/hnc_loadCurrent
      dataType: number
      unit: A
      scale: 1
      deadband: 0
      enabled: true
    - id: hnc_ratedCurrent
      address: catalog/hnc_ratedCurrent
      dataType: number
      unit: A
      scale: 1
      deadband: 0
      enabled: true
    - id: alarm
      address: catalog/alarm
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
