apiVersion: daq.gateway/v1
kind: PointTemplate
metadata:
  id: jdsoft-standard
  displayName: 精雕 标准目录
spec:
  adapter: jdsoft
  points:
    - id: machinePosition
      address: catalog/machinePosition
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: absolutePosition
      address: catalog/absolutePosition
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: relativePosition
      address: catalog/relativePosition
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeed
      address: catalog/spindleSpeed
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: feedRate
      address: catalog/feedRate
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: toolNumber
      address: catalog/toolNumber
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: program
      address: catalog/program
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: programMain
      address: catalog/programMain
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: state
      address: catalog/state
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: workMode
      address: catalog/workMode
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: runTime
      address: catalog/runTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: cutTime
      address: catalog/cutTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: cycleTime
      address: catalog/cycleTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: partCount
      address: catalog/partCount
      dataType: number
      unit: pcs
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleOverride
      address: catalog/spindleOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: feedOverride
      address: catalog/feedOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: jdsoft_spindleCurrent
      address: catalog/jdsoft_spindleCurrent
      dataType: number
      unit: A
      scale: 1
      deadband: 0
      enabled: true
    - id: jdsoft_spindlePower
      address: catalog/jdsoft_spindlePower
      dataType: number
      unit: kW
      scale: 1
      deadband: 0
      enabled: true
    - id: jdsoft_spindleTorque
      address: catalog/jdsoft_spindleTorque
      dataType: number
      unit: Nm
      scale: 1
      deadband: 0
      enabled: true
    - id: alarm
      address: catalog/alarm
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: axisLoadX
      address: catalog/axisLoadX
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: axisLoadY
      address: catalog/axisLoadY
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: axisLoadZ
      address: catalog/axisLoadZ
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: jdsoft_spindle1CurrentLoad
      address: catalog/jdsoft_spindle1CurrentLoad
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: jdsoft_spindle1PowerLoad
      address: catalog/jdsoft_spindle1PowerLoad
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: jdsoft_spindle1TorqueLoad
      address: catalog/jdsoft_spindle1TorqueLoad
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleTemp
      address: catalog/spindleTemp
      dataType: number
      unit: °C
      scale: 1
      deadband: 0
      enabled: true
    - id: jdsoft_cabinetTemp
      address: catalog/jdsoft_cabinetTemp
      dataType: number
      unit: °C
      scale: 1
      deadband: 0
      enabled: true
