apiVersion: daq.gateway/v1
kind: PointTemplate
metadata:
  id: brother-standard
  displayName: 兄弟 标准目录
spec:
  adapter: brother
  points:
    - id: state
      address: catalog/state
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: workMode
      address: catalog/workMode
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: estop
      address: catalog/estop
      dataType: bool
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeed
      address: catalog/spindleSpeed
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: feedRate
      address: catalog/feedRate
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleOverride
      address: catalog/spindleOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: brother_feedOvertravelOverride
      address: catalog/brother_feedOvertravelOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: rapidOverride
      address: catalog/rapidOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: program
      address: catalog/program
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: partCount
      address: catalog/partCount
      dataType: number
      unit: pcs
      scale: 1
      deadband: 0
      enabled: true
    - id: toolNumber
      address: catalog/toolNumber
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: toolNext
      address: catalog/toolNext
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: brother_toolPot
      address: catalog/brother_toolPot
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: powerOnTime
      address: catalog/powerOnTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: cycleTime
      address: catalog/cycleTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: runTime
      address: catalog/runTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: cutTime
      address: catalog/cutTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: alarm
      address: catalog/alarm
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
