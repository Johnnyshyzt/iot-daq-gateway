apiVersion: daq.gateway/v1
kind: PointTemplate
metadata:
  id: fagor-standard
  displayName: 法格 标准目录
spec:
  adapter: fagor
  points:
    - id: feedRate
      address: catalog/feedRate
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: feedRateCmd
      address: catalog/feedRateCmd
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: feedOverride
      address: catalog/feedOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeed
      address: catalog/spindleSpeed
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeedCmd
      address: catalog/spindleSpeedCmd
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleOverride
      address: catalog/spindleOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: workMode
      address: catalog/workMode
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: program
      address: catalog/program
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: fagor_feedRateActualX
      address: catalog/fagor_feedRateActualX
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: fagor_feedRateActualY
      address: catalog/fagor_feedRateActualY
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: fagor_feedRateActualZ
      address: catalog/fagor_feedRateActualZ
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: fagor_feedOverrideX
      address: catalog/fagor_feedOverrideX
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: fagor_feedOverrideY
      address: catalog/fagor_feedOverrideY
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: fagor_feedOverrideZ
      address: catalog/fagor_feedOverrideZ
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: fagor_actualPositionX
      address: catalog/fagor_actualPositionX
      dataType: number
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: fagor_actualPositionY
      address: catalog/fagor_actualPositionY
      dataType: number
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: fagor_actualPositionZ
      address: catalog/fagor_actualPositionZ
      dataType: number
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
