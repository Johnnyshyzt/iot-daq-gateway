apiVersion: daq.gateway/v1
kind: PointTemplate
metadata:
  id: gsk-standard
  displayName: 广数 标准目录
spec:
  adapter: gsk
  points:
    - id: workMode
      address: catalog/workMode
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: state
      address: catalog/state
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: program
      address: catalog/program
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: axisCount
      address: catalog/axisCount
      dataType: number
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: machinePosition
      address: catalog/machinePosition
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: partCount
      address: catalog/partCount
      dataType: number
      unit: pcs
      scale: 1
      deadband: 0
      enabled: true
    - id: runTime
      address: catalog/runTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: cutTime
      address: catalog/cutTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: feedRateCmd
      address: catalog/feedRateCmd
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: feedRate
      address: catalog/feedRate
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: feedOverride
      address: catalog/feedOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeedCmd
      address: catalog/spindleSpeedCmd
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeed
      address: catalog/spindleSpeed
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleOverride
      address: catalog/spindleOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: rapidOverride
      address: catalog/rapidOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: gsk_manualOverride
      address: catalog/gsk_manualOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: gsk_mpgOverride
      address: catalog/gsk_mpgOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: toolNumber
      address: catalog/toolNumber
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: gsk_gModal
      address: catalog/gsk_gModal
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: gsk_mModal
      address: catalog/gsk_mModal
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: alarm
      address: catalog/alarm
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
