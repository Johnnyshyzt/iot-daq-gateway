apiVersion: daq.gateway/v1
kind: PointTemplate
metadata:
  id: citizen-standard
  displayName: 三菱西铁城 标准目录
spec:
  adapter: citizen
  points:
    - id: workMode
      address: catalog/workMode
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: state
      address: catalog/state
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: program
      address: catalog/program
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: programComment
      address: catalog/programComment
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: partCount
      address: catalog/partCount
      dataType: number
      unit: pcs
      scale: 1
      deadband: 0
      enabled: true
    - id: cycleTime
      address: catalog/cycleTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: machinePosition
      address: catalog/machinePosition
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: citizen_programPosition
      address: catalog/citizen_programPosition
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: absolutePosition
      address: catalog/absolutePosition
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: distanceToGo
      address: catalog/distanceToGo
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: citizen_autoStartTime
      address: catalog/citizen_autoStartTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: powerOnTime
      address: catalog/powerOnTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeedCmd
      address: catalog/spindleSpeedCmd
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeed
      address: catalog/spindleSpeed
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: feedRateCmd
      address: catalog/feedRateCmd
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: feedRate
      address: catalog/feedRate
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleLoad
      address: catalog/spindleLoad
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: feedOverride
      address: catalog/feedOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: toolNumber
      address: catalog/toolNumber
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleTemp
      address: catalog/spindleTemp
      dataType: number
      unit: °C
      scale: 1
      deadband: 0
      enabled: true
