apiVersion: daq.gateway/v1
kind: PointTemplate
metadata:
  id: mazak-matrix-standard
  displayName: 马扎克 640/matrix 标准目录
spec:
  adapter: mazak-matrix
  points:
    - id: systemType
      address: catalog/systemType
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: workMode
      address: catalog/workMode
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: state
      address: catalog/state
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: program
      address: catalog/program
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: programComment
      address: catalog/programComment
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleLoad
      address: catalog/spindleLoad
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: toolNumber
      address: catalog/toolNumber
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: partCount
      address: catalog/partCount
      dataType: number
      unit: pcs
      scale: 1
      deadband: 0
      enabled: true
    - id: rapidOverride
      address: catalog/rapidOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleOverride
      address: catalog/spindleOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: feedOverride
      address: catalog/feedOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeed
      address: catalog/spindleSpeed
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: alarm
      address: catalog/alarm
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
