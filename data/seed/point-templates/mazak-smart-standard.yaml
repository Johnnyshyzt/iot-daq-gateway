apiVersion: daq.gateway/v1
kind: PointTemplate
metadata:
  id: mazak-smart-standard
  displayName: 马扎克 smart/smooth 标准目录
spec:
  adapter: mazak-smart
  points:
    - id: serialNumber
      address: catalog/serialNumber
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: softwareVersion
      address: catalog/softwareVersion
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: servoLoad
      address: catalog/servoLoad
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: machinePosition
      address: catalog/machinePosition
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: distanceToGo
      address: catalog/distanceToGo
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: axisCount
      address: catalog/axisCount
      dataType: number
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: mazak-smart_servoAxisNames
      address: catalog/mazak-smart_servoAxisNames
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: program
      address: catalog/program
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: programComment
      address: catalog/programComment
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: programLine
      address: catalog/programLine
      dataType: number
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: programMain
      address: catalog/programMain
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: toolNumber
      address: catalog/toolNumber
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleLoad
      address: catalog/spindleLoad
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleTemp
      address: catalog/spindleTemp
      dataType: number
      unit: °C
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeed
      address: catalog/spindleSpeed
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleOverride
      address: catalog/spindleOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: feedOverride
      address: catalog/feedOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: rapidOverride
      address: catalog/rapidOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: workMode
      address: catalog/workMode
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: state
      address: catalog/state
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: cutTime
      address: catalog/cutTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: powerOnTime
      address: catalog/powerOnTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: partCount
      address: catalog/partCount
      dataType: number
      unit: pcs
      scale: 1
      deadband: 0
      enabled: true
    - id: alarm
      address: catalog/alarm
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: estop
      address: catalog/estop
      dataType: bool
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
