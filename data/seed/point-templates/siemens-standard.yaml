apiVersion: daq.gateway/v1
kind: PointTemplate
metadata:
  id: siemens-standard
  displayName: 西门子 标准目录
spec:
  adapter: siemens
  points:
    - id: softwareVersion
      address: catalog/softwareVersion
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: systemType
      address: catalog/systemType
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: serialNumber
      address: catalog/serialNumber
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: workMode
      address: catalog/workMode
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: state
      address: catalog/state
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: partCount
      address: catalog/partCount
      dataType: number
      unit: pcs
      scale: 1
      deadband: 0
      enabled: true
    - id: cycleTime
      address: catalog/cycleTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: remainTime
      address: catalog/remainTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: program
      address: catalog/program
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: feedRateCmd
      address: catalog/feedRateCmd
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: feedRate
      address: catalog/feedRate
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeedCmd
      address: catalog/spindleSpeedCmd
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeed
      address: catalog/spindleSpeed
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: feedOverride
      address: catalog/feedOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleOverride
      address: catalog/spindleOverride
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: machinePosition
      address: catalog/machinePosition
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: relativePosition
      address: catalog/relativePosition
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: distanceToGo
      address: catalog/distanceToGo
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: toolNumber
      address: catalog/toolNumber
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: programBlock
      address: catalog/programBlock
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: siemens_voltage
      address: catalog/siemens_voltage
      dataType: number
      unit: V
      scale: 1
      deadband: 0
      enabled: true
    - id: siemens_current
      address: catalog/siemens_current
      dataType: number
      unit: A
      scale: 1
      deadband: 0
      enabled: true
    - id: servoLoad
      address: catalog/servoLoad
      dataType: number
      unit: "%"
      scale: 1
      deadband: 0
      enabled: true
    - id: siemens_motorTemp
      address: catalog/siemens_motorTemp
      dataType: number
      unit: °C
      scale: 1
      deadband: 0
      enabled: true
    - id: siemens_driveTemp
      address: catalog/siemens_driveTemp
      dataType: number
      unit: °C
      scale: 1
      deadband: 0
      enabled: true
