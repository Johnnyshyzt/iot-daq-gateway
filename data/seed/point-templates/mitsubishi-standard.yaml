apiVersion: daq.gateway/v1
kind: PointTemplate
metadata:
  id: mitsubishi-standard
  displayName: 三菱 标准目录
spec:
  adapter: mitsubishi
  points:
    - id: state
      address: catalog/state
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: workMode
      address: catalog/workMode
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: axisCount
      address: catalog/axisCount
      dataType: number
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: machinePosition
      address: catalog/machinePosition
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: relativePosition
      address: catalog/relativePosition
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: absolutePosition
      address: catalog/absolutePosition
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: distanceToGo
      address: catalog/distanceToGo
      dataType: string
      unit: mm
      scale: 1
      deadband: 0
      enabled: true
    - id: partCount
      address: catalog/partCount
      dataType: number
      unit: pcs
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeed
      address: catalog/spindleSpeed
      dataType: number
      unit: rpm
      scale: 1
      deadband: 0
      enabled: true
    - id: feedRate
      address: catalog/feedRate
      dataType: number
      unit: mm/min
      scale: 1
      deadband: 0
      enabled: true
    - id: programMain
      address: catalog/programMain
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: program
      address: catalog/program
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: programBlock
      address: catalog/programBlock
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: toolNumber
      address: catalog/toolNumber
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: runTime
      address: catalog/runTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: powerOnTime
      address: catalog/powerOnTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: cycleTime
      address: catalog/cycleTime
      dataType: number
      unit: s
      scale: 1
      deadband: 0
      enabled: true
    - id: programLine
      address: catalog/programLine
      dataType: number
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: alarm
      address: catalog/alarm
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
