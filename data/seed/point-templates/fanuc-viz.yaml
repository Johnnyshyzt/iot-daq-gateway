apiVersion: daq.gateway/v1
kind: PointTemplate
metadata:
  id: fanuc-viz
  displayName: 发那科 可视化
spec:
  adapter: fanuc
  points:
    - id: state
      address: catalog/state
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: workMode
      address: catalog/workMode
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: alarm
      address: catalog/alarm
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: estop
      address: catalog/estop
      dataType: bool
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: program
      address: catalog/program
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: partCount
      address: catalog/partCount
      dataType: number
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: partCountTotal
      address: catalog/partCountTotal
      dataType: number
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleSpeed
      address: catalog/spindleSpeed
      dataType: number
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleLoad
      address: catalog/spindleLoad
      dataType: number
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: spindleOverride
      address: catalog/spindleOverride
      dataType: number
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: feedRate
      address: catalog/feedRate
      dataType: number
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: feedOverride
      address: catalog/feedOverride
      dataType: number
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
