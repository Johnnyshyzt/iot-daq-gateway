apiVersion: daq.gateway/v1
kind: PointSet
metadata:
  deviceId: cnc-01
spec:
  points:
    - id: state
      address: cnc/statinfo
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: alarm
      address: cnc/alarm
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
    - id: program
      address: cnc/program
      dataType: string
      unit: ""
      scale: 1
      deadband: 0
      enabled: true
