name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pack-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.203
      - name: Pack self-contained win-x64 zip
        shell: pwsh
        run: ./scripts/pack-win-x64.ps1
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/win-x64/*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No zip under artifacts/win-x64" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
