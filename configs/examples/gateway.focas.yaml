# Example for the real FOCAS adapter stub (offline until vendor libs are wired).
gateway:
  id: gw-line-01
  site: plant-a

pipeline:
  sweepInterval: 00:00:02
  changeOnly: true

programTransfer:
  enabled: false

mqtt:
  host: 127.0.0.1
  port: 1883
  clientId: iot-daq-gateway
  qos: 1

devices:
  - id: cnc-01
    enabled: true
    adapter: fanuc.focas
    options:
      host: 192.168.1.10
      port: 8193
      timeoutMs: 3000
