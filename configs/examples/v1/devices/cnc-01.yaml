# fanuc.fake runs without a machine. Switch adapter to fanuc.focas on Windows x64
# and place a licensed Fwlib64.dll beside the process (never commit the DLL).
apiVersion: daq.gateway/v1
kind: Device
metadata:
  id: cnc-01
  displayName: Lathe 01
spec:
  adapter: fanuc.fake
  enabled: true
  intervalMs: 1000
  pointTemplateId: fanuc-standard
  connection:
    host: 192.168.1.10
    port: 8193
    focasTimeoutMs: 3000
