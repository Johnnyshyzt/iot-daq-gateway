# v1 bundle example for Config Studio. Gateway.Host does not load this tree;
# it still uses the single-file YAML next to this directory.
# Layout and revision rules: docs/config/README.md
apiVersion: daq.gateway/v1
kind: Gateway
metadata:
  siteId: plant-a
  name: Plant A Gateway
spec:
  logLevel: Information
  features:
    programWrite: false
  acquisition:
    defaultIntervalMs: 1000
    changeOnly: true
