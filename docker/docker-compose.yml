services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - mosquitto
    ports:
      - "8080:8080"
    environment:
      GATEWAY_CONFIG: /app/gateway.yaml
      GATEWAY_CONSOLE_TOKEN: change-me
    # Writable overlay so the web console can persist devices without an image rebuild.
    # Linux Compose remains a Fake demo — not a production FOCAS path.
    volumes:
      - ../configs/examples/gateway.docker.yaml:/app/gateway.yaml
