services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - mosquitto
    environment:
      GATEWAY_CONFIG: /app/gateway.yaml
