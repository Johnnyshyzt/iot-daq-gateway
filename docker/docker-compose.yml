services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - mosquitto
    environment:
      GATEWAY_CONFIG: /app/gateway.yaml
    # Overlay example YAML so CNC IP / devices can change without an image rebuild.
    # Linux Compose remains a Fake demo — not a production FOCAS path.
    volumes:
      - ../configs/examples/gateway.docker.yaml:/app/gateway.yaml:ro
