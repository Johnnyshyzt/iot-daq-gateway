services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - mosquitto
    ports:
      - "127.0.0.1:5080:5080"
    environment:
      GATEWAY_CONFIG: /app/gateway.yaml
      # appsettings binds 127.0.0.1, which is unreachable through a published port.
      ASPNETCORE_URLS: http://0.0.0.0:5080
    # Overlay example YAML. An empty database imports it once (MQTT host mosquitto).
    # Later edits belong in the database. The named volume keeps gateway.db.
    # Linux Compose remains a Fake demo — not a production FOCAS path.
      # The host port stays on 127.0.0.1. Do not publish 0.0.0.0.
      # HTTPS stays off unless data/https/binding.json exists. This Compose sets ASPNETCORE_URLS to HTTP.
    volumes:
      - gateway-data:/app/data
      - ../configs/examples/gateway.docker.yaml:/app/gateway.yaml:ro

volumes:
  gateway-data:
